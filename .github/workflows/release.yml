name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: versions match tag
        run: make check-version TAG="$GITHUB_REF_NAME"
      - run: make lint test

  github-release:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            bin/git-anon bin/git-remote-anon install.sh \
            --title "$GITHUB_REF_NAME" --generate-notes

  npm-publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # npm trusted publishing + provenance
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@latest
      - name: publish
        env:
          # Optional: without this secret, npm trusted publishing (OIDC) is used.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          v=$(node -p 'require("./package.json").version')
          if npm view "git-anon@$v" version >/dev/null 2>&1; then
            echo "git-anon@$v is already on npm, skipping"
            exit 0
          fi
          npm publish --provenance --access public
