name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: shellcheck
        run: make lint
      - name: versions in sync
        run: make check-version

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # ubuntu: /bin/sh is dash; macOS: /bin/sh is bash in POSIX mode.
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - run: git --version
      - run: make test

  test-busybox:
    name: test (alpine / busybox ash)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: run tests in alpine
        run: |
          docker run --rm -v "$PWD:/src" -w /src alpine:latest \
            sh -c 'apk add --no-cache git openssh-client >/dev/null && sh tests/run.sh'

  npm-package:
    name: npm package (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: pack and install globally
        run: |
          npm pack
          npm install -g ./git-anon-*.tgz
      - name: smoke test installed commands
        run: |
          git anon version
          command -v git-remote-anon
          tmp=$(mktemp -d)
          git init -q --bare "$tmp/remote.git"
          git init -q "$tmp/work"
          cd "$tmp/work"
          git remote add origin "$tmp/remote.git"
          GIT_ANON_MAP="$tmp/map" git anon init
          GIT_ANON_MAP="$tmp/map" git ls-remote origin
          git remote get-url origin | grep -q '^anon::'
