name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: shellcheck
        run: make lint
      - name: versions in sync
        run: make check-version

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # ubuntu: /bin/sh is dash; macOS: bash in POSIX mode;
        # windows: Git for Windows' MSYS bash.
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - run: git --version
      - run: sh tests/run.sh

  test-busybox:
    name: test (alpine / busybox ash)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: run tests in alpine
        run: |
          docker run --rm -v "$PWD:/src" -w /src alpine:latest \
            sh -c 'apk add --no-cache git openssh-client >/dev/null && sh tests/run.sh'

  npm-package:
    name: npm package (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: pack and install globally
        run: |
          npm pack
          npm install -g ./git-anon-*.tgz
      - name: smoke test installed commands
        run: |
          git anon version
          command -v git-remote-anon
          tmp=$(mktemp -d)
          git init -q --bare "$tmp/remote.git"
          git init -q "$tmp/work"
          cd "$tmp/work"
          git remote add origin "$tmp/remote.git"
          GIT_ANON_MAP="$tmp/map" git anon init
          GIT_ANON_MAP="$tmp/map" git ls-remote origin
          git remote get-url origin | grep -q '^anon::'

  npm-package-windows:
    name: npm package (windows-latest, PowerShell)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: pack and install globally
        run: |
          npm pack
          npm install -g (Get-ChildItem git-anon-*.tgz).FullName
      - name: smoke test from PowerShell
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          git anon version
          $tmp = Join-Path $env:RUNNER_TEMP ([guid]::NewGuid())
          git init -q --bare "$tmp/remote.git"
          git init -q "$tmp/work"
          Set-Location "$tmp/work"
          git -c user.name=ci -c user.email=ci@example.com commit -q --allow-empty -m init
          git remote add origin "$tmp/remote.git"
          $env:GIT_ANON_MAP = "$tmp/map"
          git anon init
          git push -q origin HEAD:main
          git ls-remote origin
          $url = git remote get-url origin
          if ($url -notlike 'anon::*') { throw "remote not anonymized: $url" }
          git anon off
          if ((git remote get-url origin) -like 'anon::*') { throw "off did not restore" }
